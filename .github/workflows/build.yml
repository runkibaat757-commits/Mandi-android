name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q MandiLive_android_for_github.zip -d proj
      - name: Fix Java target
        working-directory: proj
        run: |
          sed -i '/^android {/a\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }' app/build.gradle.kts
          sed -i '/^dependencies {/a\    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")' app/build.gradle.kts
          sed -i 's/r\.message? :/r.message ?: /' app/src/main/java/com/mandilive/app/MainActivity.kt
          cat app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MandiLive-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          
